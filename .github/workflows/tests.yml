name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        season: ["01"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: серии сезона ${{ matrix.season }}
        run: make test SEASON=${{ matrix.season }}

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make links
