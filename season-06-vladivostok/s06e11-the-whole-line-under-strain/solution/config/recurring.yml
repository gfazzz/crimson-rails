# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# Расписание конторы (bin/jobs его читает и ставит записки сам).
#
# Время в расписании — с часовым поясом: «в восемь» без пояса значит «в
# восемь там, где запущен bin/jobs», а он может стоять в Лондоне.
#
# Одну и ту же минуту два надзирателя не поставят дважды: Solid Queue
# запоминает, на какое время записка по расписанию уже поставлена, —
# уникальный индекс на (задача, время) (s04e04, s06e04).
default: &default
  daily_report:
    class: DailyReportJob
    queue: default
    schedule: every day at 8am Asia/Vladivostok
  # Сверка с казначейством — первого числа, за прошлый месяц.
  reconcile:
    class: ReconcileJob
    queue: default
    schedule: "0 9 1 * * Asia/Vladivostok"

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
