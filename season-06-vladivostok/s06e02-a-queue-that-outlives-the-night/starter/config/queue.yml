# Работники очереди конторы (bin/jobs).
#
# TODO: у телеграфа — свой работник, и ровно один поток: линия принимает по
#       одной. Прочие очереди — своему работнику. Помни, что "*" слушает всё.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
